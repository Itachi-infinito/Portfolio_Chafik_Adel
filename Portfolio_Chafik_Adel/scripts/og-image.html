<!doctype html>
<!--
  Gabarit de l'image de partage (Open Graph), 1200 × 630.
  Tailles de texte ≥ 24 px : l'aperçu LinkedIn affiche l'image à ~45 %.
  Régénérer depuis le dossier Portfolio_Chafik_Adel/ :
    "C:/Program Files/Google/Chrome/Application/chrome.exe" --headless=new --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot="$PWD/public/og-image.png" "file:///$PWD/scripts/og-image.html"
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" />
<style>
  :root {
    --paper:  #F6F5F1;
    --ink:    #16181D;
    --muted:  #4A4D55;
    --copper: #B4541A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 64px 72px 56px;
    display: grid;
    grid-template-columns: 1fr 440px;
    grid-template-rows: 1fr auto;
    column-gap: 56px;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }

  .id { align-self: center; }
  .label { font-size: 24px; letter-spacing: 0.06em; color: var(--copper); }
  h1 { margin-top: 20px; font-size: 104px; font-weight: 600; line-height: 0.98; letter-spacing: -0.025em; }
  .role { margin-top: 28px; font-size: 38px; line-height: 1.25; }

  figure { align-self: center; }
  figure img {
    display: block;
    width: 440px;
    height: 330px;
    object-fit: cover;
    border: 2px solid var(--ink);
  }

  .bottom {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    padding-top: 22px;
    border-top: 2px solid var(--ink);
    font-size: 26px;
    color: var(--muted);
  }
  .bottom .url { color: var(--ink); }
</style>
</head>
<body>
  <div class="id">
    <p class="label mono">ALTIUM · LORAWAN · LTE-M</p>
    <h1>Adel<br />Chafik</h1>
    <p class="role">Ingénieur Électronique<br />&amp; PCB Designer</p>
  </div>

  <figure>
    <img src="../public/images/projects/esp32-iot/pcb.jpg" alt="" />
  </figure>

  <div class="bottom mono">
    <span class="url">adelchafik.com</span>
    <span>ECAM Brussels · Belgique</span>
  </div>
</body>
</html>
